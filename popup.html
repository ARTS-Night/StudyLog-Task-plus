<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      max-height: 500px;
      margin: 0;
      padding: 12px;
      font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
      font-size: 13px;
      color: #333;
      box-sizing: border-box;
      overflow-y: auto;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 10px;
      font-size: 15px;
    }

    .lms-icon {
      vertical-align: -3px;
      flex: 0 0 auto;
    }

    .subject {
      margin-bottom: 12px;
    }

    .subject-name {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      font-size: 13px;
      padding: 5px 6px;
      background: #f4f6f8;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .subject-name .count {
      margin-left: auto;
      font-weight: normal;
      font-size: 11px;
      color: #2196F3;
    }

    ul.tasks {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    ul.tasks li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 4px 6px;
      border-bottom: 1px solid #f0f0f0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    ul.tasks li.done {
      text-decoration: line-through;
      color: #aaa;
    }

    ul.tasks li .mark {
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .empty {
      color: #999;
      padding: 12px 4px;
      text-align: center;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>
    <svg class="lms-icon" viewBox="0 0 24 24" width="18" height="18" fill="#4CAF50"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-3.06 16L7.4 14.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L11 18zM13 9V3.5L18.5 9H13z"/></svg>
    すべてのタスク
  </h1>
  <div id="content"><div class="empty">読み込み中...</div></div>
  <div class="note">タスクの追加・編集は授業ページ上のボタンから行えます。</div>
  <script src="popup.js"></script>
</body>
</html>
