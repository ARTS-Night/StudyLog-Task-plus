<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      max-height: 500px;
      margin: 0;
      padding: 12px;
      font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
      font-size: 13px;
      color: #333;
      box-sizing: border-box;
      overflow-y: auto;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 10px;
      font-size: 15px;
    }

    #btn-settings {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      border: none;
      background: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: #888;
    }

    #btn-settings:hover {
      background: #f0f0f0;
      color: #333;
    }

    ul.tasks li .mark {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      line-height: 1;
    }

    .lms-icon {
      vertical-align: -3px;
      flex: 0 0 auto;
    }

    .subject {
      margin-bottom: 12px;
    }

    .subject-name {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      font-size: 13px;
      padding: 5px 6px;
      background: #f4f6f8;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .subject-name .count {
      margin-left: auto;
      font-weight: normal;
      font-size: 11px;
      color: #2196F3;
    }

    ul.tasks {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    ul.tasks li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 4px 6px;
      border-bottom: 1px solid #f0f0f0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    ul.tasks li.done {
      text-decoration: line-through;
      color: #aaa;
    }

    ul.tasks li .mark {
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .empty {
      color: #999;
      padding: 12px 4px;
      text-align: center;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>
    <svg class="lms-icon" viewBox="0 0 24 24" width="18" height="18" fill="#4CAF50"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-3.06 16L7.4 14.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L11 18zM13 9V3.5L18.5 9H13z"/></svg>
    すべてのタスク
    <button id="btn-settings" type="button" title="設定">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </h1>
  <div id="content"><div class="empty">読み込み中...</div></div>
  <div class="note">○ をクリックで完了/未完了を切り替えできます。追加・編集は授業ページから。</div>
  <script src="sync-guard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
