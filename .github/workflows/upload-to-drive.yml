name: Zip and Upload to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Google 公式 API ライブラリのインストール
      #    OAuth ユーザー認証（refresh token）の検証・更新には google-auth だけで足り、
      #    google-auth-oauthlib はローカルでの初回同意フロー専用なので CI 側では不要。
      - name: Install Google API client
        run: |
          pip install --no-cache-dir google-api-python-client google-auth

      # 4. ZIP ファイルの作成
      - name: Create ZIP archive
        run: |
          DATE=$(date +'%Y%m%d')
          VERSION=${GITHUB_SHA:0:7}
          TARGETS="src image README.md manifest.json" # まとめたいフォルダやファイル
          ZIP_NAME="archive_${DATE}_${VERSION}.zip"
          
          zip -r9 "$ZIP_NAME" $TARGETS
          # 後続の Python スクリプトにファイル名を渡すため環境変数にセット
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      # 5. ZIP のアップロード ＆ 個別 Markdown ファイルの直接アップロード（同名なら上書き）
      #    サービスアカウントには保存容量が割り当てられておらず、フォルダを共有しても
      #    storageQuotaExceeded で失敗するため、実際の Google ユーザーとして認証する
      #    OAuth（refresh token）方式を使う。
      - name: Upload Files to Google Drive via Official API
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import mimetypes
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          # 1. 環境変数のセットアップ（secret に混入しがちな前後の空白・改行を除去）
          def required_env(name):
              value = os.environ.get(name, '').strip()
              if not value:
                  print(f"エラー: {name} が空です。リポジトリの Secrets を確認してください。")
                  sys.exit(1)
              return value

          client_id = required_env('GDRIVE_CLIENT_ID')
          client_secret = required_env('GDRIVE_CLIENT_SECRET')
          refresh_token = required_env('GDRIVE_REFRESH_TOKEN')
          folder_id = required_env('GDRIVE_FOLDER_ID')
          zip_file_name = os.environ['ZIP_NAME'].strip()

          # ★直接配置＆上書きしたいマークダウンファイル群（ここを自由に増やせます！）
          MD_FILES = [
              'README.md',
              '344赤池璃月＿企画書.md',
              '344赤池璃月_研究資料.md' #md ファイル名（必要に応じて書き換えてください）
          ]

          # 2. 認証情報の作成（実際の Google ユーザーとして、refresh token からアクセストークンを取得）
          creds = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri='https://oauth2.googleapis.com/token',
              client_id=client_id,
              client_secret=client_secret,
              scopes=['https://www.googleapis.com/auth/drive.file']
          )
          try:
              creds.refresh(Request())
          except Exception as error:
              print(
                  "エラー: refresh token からアクセストークンを取得できませんでした。\n"
                  "GDRIVE_CLIENT_ID / GDRIVE_CLIENT_SECRET / GDRIVE_REFRESH_TOKEN が正しいか、"
                  "refresh token が失効・取り消されていないか確認してください。"
              )
              raise error

          service = build('drive', 'v3', credentials=creds)
          print("認証: OAuth ユーザーアカウント（refresh token）で認証しました")

          def die_with_permission_hint(error, folder_id):
              # 認証したアカウントが対象フォルダへアクセスできないと 404 (File not found) を返す。
              # 403 ではなく 404 になるのは、権限が無いことを教えないための Drive API の仕様。
              if isinstance(error, HttpError) and error.resp is not None and error.resp.status == 404:
                  print(
                      f"エラー: フォルダ (ID: {folder_id}) が見つかりません。\n"
                      "GDRIVE_FOLDER_ID の値が正しいか、認証に使った Google アカウントが"
                      "このフォルダへアクセスできるか確認してください。"
                  )
              raise error

          # ----------------------------------------------------
          # 処理 A: ZIP ファイルの新規アップロード
          # ----------------------------------------------------
          print(f"=== Uploading ZIP Archive: {zip_file_name} ===")
          zip_metadata = {'name': zip_file_name, 'parents': [folder_id]}
          zip_media = MediaFileUpload(zip_file_name, mimetype='application/zip', resumable=True)

          try:
              uploaded_zip = service.files().create(
                  body=zip_metadata,
                  media_body=zip_media,
                  fields='id, name',
                  supportsAllDrives=True
              ).execute()
          except HttpError as error:
              die_with_permission_hint(error, folder_id)
          print(f"Successfully uploaded ZIP! File ID: {uploaded_zip.get('id')}\n")

          # ----------------------------------------------------
          # 処理 B: Markdown ファイルの個別アップロード（既存があれば上書き）
          # ----------------------------------------------------
          print("=== Uploading / Updating Markdown Files ===")
          for file_path in MD_FILES:
              if not os.path.exists(file_path):
                  print(f"Skipping '{file_path}': File not found on repository.")
                  continue

              file_name = os.path.basename(file_path)
              mime_type, _ = mimetypes.guess_type(file_path)
              if mime_type is None:
                  mime_type = 'text/markdown'

              # 既存の同名ファイルがあるか Google Drive 内を検索
              query = f"'{folder_id}' in parents and name = '{file_name}' and trashed = false"
              try:
                  results = service.files().list(
                      q=query,
                      fields="files(id, name)",
                      supportsAllDrives=True,
                      includeItemsFromAllDrives=True
                  ).execute()
              except HttpError as error:
                  die_with_permission_hint(error, folder_id)
              existing_files = results.get('files', [])

              media = MediaFileUpload(file_path, mimetype=mime_type, resumable=True)

              try:
                  if existing_files:
                      # 同名ファイルが存在すれば ID を指定して内容を「上書き更新」
                      file_id = existing_files[0]['id']
                      print(f"Overwriting existing file '{file_name}' (ID: {file_id})...")
                      updated = service.files().update(
                          fileId=file_id,
                          media_body=media,
                          fields='id, name',
                          supportsAllDrives=True
                      ).execute()
                      print(f"Successfully updated '{file_name}'!")
                  else:
                      # 存在しなければ新規作成
                      print(f"Creating new file '{file_name}'...")
                      file_metadata = {'name': file_name, 'parents': [folder_id]}
                      created = service.files().create(
                          body=file_metadata,
                          media_body=media,
                          fields='id, name',
                          supportsAllDrives=True
                      ).execute()
                      print(f"Successfully uploaded '{file_name}'!")
              except HttpError as error:
                  die_with_permission_hint(error, folder_id)

          EOF