<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタログ授業タスク管理</title>
  <style>
    /* スタログ本体（Bootstrap 3）に合わせたフラットな配色・角丸・パネル構成 */
    :root {
      color-scheme: light;
      --green: #4CAF50;
      --green-dark: #45a049;
      --blue: #337ab7;
      --danger: #d32f2f;
      --ink: #333333;
      --muted: #777777;
      --line: #dddddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #f5f5f5;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select,
    summary {
      cursor: pointer;
    }

    /* Material Symbols（fonts.google.com/icons）のインラインSVG共通 */
    .mi {
      flex: 0 0 auto;
      vertical-align: -3px;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(51, 122, 183, 0.35);
      outline-offset: 2px;
    }

    .site-header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .site-header-inner,
    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
    }

    .site-header-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 8px 0;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .settings-link {
      margin-left: auto;
      color: var(--blue);
      font-size: 13px;
      text-decoration: none;
    }

    .settings-link:hover {
      text-decoration: underline;
    }

    main {
      padding: 20px 0 48px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #ffffff;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
    }

    .panel-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
      padding: 10px 15px;
      border-bottom: 1px solid var(--line);
      border-radius: 3px 3px 0 0;
      background: #f5f5f5;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
    }

    .summary,
    .catalog-status {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .heading-actions {
      margin-left: auto;
    }

    .panel-body {
      padding: 15px;
    }

    .button {
      display: inline-flex;
      flex: 0 0 auto;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 14px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      color: var(--ink);
      background: #ffffff;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .button:hover:not(:disabled) {
      border-color: #adadad;
      background: #e6e6e6;
    }

    .button:active:not(:disabled) {
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .button.primary {
      border-color: var(--green);
      color: #ffffff;
      background: var(--green);
    }

    .button.primary:hover:not(:disabled) {
      border-color: var(--green-dark);
      background: var(--green-dark);
      box-shadow: 0 2px 6px rgba(76, 175, 80, 0.35);
    }

    .button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .button.danger:hover:not(:disabled) {
      background: #fdecea;
    }

    .button.small {
      min-height: 28px;
      padding: 3px 10px;
      font-size: 12px;
    }

    .field {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    .field > label {
      font-weight: 600;
      font-size: 13px;
    }

    input[type="search"],
    select,
    textarea {
      width: 100%;
      border: 1px solid #cccccc;
      border-radius: 4px;
      color: var(--ink);
      background: #ffffff;
    }

    input[type="search"],
    select {
      min-height: 34px;
      padding: 6px 10px;
    }

    textarea {
      min-height: 80px;
      padding: 8px 10px;
      resize: vertical;
    }

    /* ---- タスク追加（折りたたみ） ---- */

    .add-details {
      margin-bottom: 15px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fafafa;
    }

    .add-details summary {
      display: block;
      padding: 9px 12px;
      color: var(--green-dark);
      font-weight: 700;
      list-style: none;
    }

    .add-details summary::-webkit-details-marker {
      display: none;
    }

    .add-details summary:hover {
      background: #f0f5f0;
    }

    .add-details[open] summary {
      border-bottom: 1px solid var(--line);
    }

    .add-inner {
      padding: 12px;
    }

    .add-grid {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 12px;
    }

    .class-picker {
      display: flex;
      flex-direction: column;
    }

    .class-picker input[type="search"] {
      border-radius: 4px 4px 0 0;
    }

    .class-picker select {
      margin-top: -1px;
      border-radius: 0 0 4px 4px;
    }

    .task-field,
    .form-actions {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
    }

    .add-layout {
      display: flex;
      align-items: stretch;
      gap: 16px;
    }

    .add-layout .add-grid {
      flex: 1 1 auto;
      min-width: 0;
    }

    .catalog-panel {
      display: flex;
      flex: 0 0 200px;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      padding-left: 16px;
      border-left: 1px solid var(--line);
      text-align: right;
    }

    .catalog-panel .catalog-status:empty {
      display: none;
    }

    /* ---- 検索・絞り込み ---- */

    .task-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 12px;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fafafa;
    }

    .search-input-row {
      display: flex;
      min-width: 0;
      gap: 6px;
    }

    .search-input-row input {
      min-width: 0;
      flex: 1 1 auto;
    }

    /* ---- タスク一覧 ---- */

    .task-groups {
      display: grid;
      gap: 16px;
    }

    .year-group {
      min-width: 0;
    }

    .year-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 14px;
    }

    .year-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 3px;
      color: #ffffff;
      background: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .pending-badge {
      background: #f0ad4e;
    }

    .class-list {
      display: grid;
      gap: 10px;
    }

    .class-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #ffffff;
    }

    .pending-card {
      border-color: #f0ad4e;
    }

    .class-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: #f5f5f5;
    }

    .class-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .task-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #eeeeee;
    }

    .task-item:last-child {
      border-bottom: 0;
    }

    .task-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      margin: 3px 0 0;
      accent-color: var(--green);
    }

    .task-text {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .task-main {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 2px;
    }

    .task-created {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-decoration: none;
    }

    .task-completed {
      color: var(--green-dark);
      font-size: 11px;
      line-height: 1.35;
      text-decoration: none;
    }

    .task-item.done .task-text {
      color: #999999;
      text-decoration: line-through;
    }

    .pending-task {
      background: #fffdf6;
    }

    .pending-marker {
      display: inline-flex;
      width: 17px;
      height: 17px;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      border-radius: 50%;
      color: #7a5200;
      background: #fff0c2;
      font-weight: 700;
      line-height: 1;
    }

    .pending-note {
      align-self: center;
      color: #7a5200;
      font-size: 12px;
      white-space: nowrap;
    }

    .task-actions {
      display: flex;
      gap: 6px;
    }

    .empty-state,
    .loading-state,
    .error-state {
      padding: 28px 14px;
      border: 1px dashed #cccccc;
      border-radius: 4px;
      color: var(--muted);
      text-align: center;
      background: #fbfbfb;
    }

    .error-state {
      border-color: #e6baba;
      color: var(--danger);
      background: #fff7f7;
    }

    dialog {
      width: min(520px, calc(100% - 32px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #ffffff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.4);
    }

    .dialog-inner {
      padding: 16px;
    }

    .dialog-inner h2 {
      margin-bottom: 12px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    #status {
      position: fixed;
      z-index: 20;
      bottom: 16px;
      left: 50%;
      max-width: min(420px, calc(100% - 36px));
      padding: 8px 20px;
      border-radius: 20px;
      color: #ffffff;
      background: #323232;
      font-size: 13px;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #status.show {
      opacity: 1;
    }

    #status.error {
      background: #9e3030;
    }

    @media (max-width: 640px) {
      .add-grid,
      .task-toolbar {
        grid-template-columns: 1fr;
      }

      .add-layout {
        flex-direction: column;
      }

      .catalog-panel {
        align-items: stretch;
        padding-left: 0;
        border-left: 0;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        text-align: left;
      }

      .task-field,
      .form-actions {
        grid-column: auto;
      }

      .task-item {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .task-actions {
        grid-column: 2;
        justify-content: flex-end;
      }

      .pending-note {
        grid-column: 2;
        justify-self: end;
      }

      .site-header-inner,
      main {
        width: min(100% - 20px, 960px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #status {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <h1>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#4CAF50" aria-hidden="true"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-3.06 16L7.4 14.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L11 18zM13 9V3.5L18.5 9H13z"/></svg>
        スタログ授業タスク管理
      </h1>
      <a class="settings-link" href="settings.html">設定</a>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="tasks-heading">
      <div class="panel-heading">
        <h2 id="tasks-heading">タスク一覧</h2>
        <p id="task-summary" class="summary" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="heading-actions">
          <button id="btn-refresh" class="button small" type="button" disabled><svg class="mi" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>最新の状態に更新</button>
        </div>
      </div>

      <div class="panel-body">
        <details class="add-details">
          <summary><svg class="mi" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> 新しいタスクを追加</summary>
          <div class="add-inner">
            <div class="add-layout">
              <form id="add-form" class="add-grid">
                <div class="field">
                  <label for="year-select">年度</label>
                  <select id="year-select" data-write disabled></select>
                </div>

                <div class="field">
                  <label for="class-search">授業（検索して選択）</label>
                  <div class="class-picker">
                    <input id="class-search" type="search" placeholder="授業名で絞り込み（例：プログラミング）" autocomplete="off" aria-controls="class-select" data-write disabled>
                    <select id="class-select" aria-label="授業を選択" data-write disabled></select>
                  </div>
                </div>

                <div class="field task-field">
                  <label for="new-task-text">タスク内容</label>
                  <textarea id="new-task-text" maxlength="2000" placeholder="例：第3回レポートを提出する" required data-write disabled></textarea>
                </div>

                <div class="form-actions">
                  <button id="btn-add" class="button primary" type="submit" data-write disabled><svg class="mi" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>タスクを追加</button>
                </div>
              </form>

              <div class="catalog-panel">
                <p id="catalog-status" class="catalog-status" aria-live="polite"></p>
                <button id="btn-update-catalog" class="button small" type="button" hidden><svg class="mi" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>授業一覧を更新</button>
              </div>
            </div>
          </div>
        </details>

        <div class="task-toolbar" role="search" aria-label="保存済みタスクの検索と絞り込み">
          <div class="field">
            <label for="task-search">タスクを検索</label>
            <div class="search-input-row">
              <input id="task-search" type="search" placeholder="タスク内容・授業名で検索" autocomplete="off" aria-controls="task-groups" disabled>
              <button id="btn-clear-task-search" class="button small" type="button" disabled><svg class="mi" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>クリア</button>
            </div>
          </div>
          <div class="field">
            <label for="task-status-filter">状態</label>
            <select id="task-status-filter" aria-controls="task-groups" disabled>
              <option value="all">すべて</option>
              <option value="active">未完了</option>
              <option value="done">完了</option>
            </select>
          </div>
        </div>

        <div id="task-groups" class="task-groups"></div>
      </div>
    </section>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit-form" class="dialog-inner">
      <h2 id="edit-heading">タスクを編集</h2>
      <div class="field">
        <label for="edit-task-text">タスク内容</label>
        <textarea id="edit-task-text" maxlength="2000" required data-write></textarea>
      </div>
      <div class="dialog-actions">
        <button id="btn-edit-cancel" class="button" type="button">キャンセル</button>
        <button class="button primary" type="submit" data-write>保存</button>
      </div>
    </form>
  </dialog>

  <div id="status" role="status" aria-live="polite"></div>
  <script src="../core/sync-guard.js"></script>
  <script src="../core/mutation-lock.js"></script>
  <script src="../core/task-lifecycle.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
